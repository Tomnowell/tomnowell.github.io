<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
    {% include head.html%}
    {% include google_analytics.html %}
    <script type="text/javascript" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js">
    </script>

    <script type="text/javascript">
    window.MathJax = {
        tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
    };
    </script>

    <body>
        {% include header.html %}

        <div class="page-content">
            <div class="wrapper">
            {{ content }}
            </div>
        </div>

        {% include footer.html %}

        <script type="module">
            import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

            mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                themeVariables: {
                    primaryColor: '#0F766E',
                    primaryBorderColor: '#0F7533',
                    primaryTextColor: '#ffffff',
                    secondaryColor: '#5ECAC1',
                    secondaryBorderColor: '#0F766E',
                    secondaryTextColor: '#1f2933',
                    tertiaryColor: '#754D0F',
                    tertiaryBorderColor: '#75310F',
                    tertiaryTextColor: '#ffffff',
                    lineColor: '#75310F',
                    edgeLabelBackground: '#5ECAC1',
                    fontSize: '14px'
                },
                flowchart: {
                    nodeSpacing: 35,
                    rankSpacing: 35,
                    padding: 8,
                    useMaxWidth: true
                }
            });

            document.querySelectorAll('pre code.language-mermaid').forEach((code) => {
                const diagram = document.createElement('pre');
                diagram.className = 'mermaid';
                diagram.textContent = code.textContent;
                code.parentElement.replaceWith(diagram);
            });

            await mermaid.run();

            const dropcapParagraphs = document.querySelectorAll('.post-content p:first-of-type');
            const measureDropcapParagraph = (paragraph) => {
                if (paragraph.closest('.mermaid')) {
                    paragraph.classList.add('mermaid-content');
                    return;
                }

                const computed = getComputedStyle(paragraph);
                const clone = paragraph.cloneNode(true);
                clone.classList.add('dropcap-measuring');
                clone.classList.add('single-line');
                Object.assign(clone.style, {
                    boxSizing: computed.boxSizing,
                    font: computed.font,
                    left: '-10000px',
                    letterSpacing: computed.letterSpacing,
                    lineHeight: computed.lineHeight,
                    margin: '0',
                    padding: computed.padding,
                    position: 'fixed',
                    textIndent: computed.textIndent,
                    top: '0',
                    visibility: 'hidden',
                    whiteSpace: computed.whiteSpace,
                    width: `${paragraph.getBoundingClientRect().width}px`,
                    wordSpacing: computed.wordSpacing
                });
                paragraph.after(clone);

                const range = document.createRange();
                range.selectNodeContents(clone);
                const lineCount = new Set(Array.from(range.getClientRects(), (rect) => Math.round(rect.top))).size;
                clone.remove();
                paragraph.classList.toggle('single-line', lineCount <= 1);
            };

            const dropcapObserver = new ResizeObserver((entries) => {
                entries.forEach(({ target }) => measureDropcapParagraph(target));
            });
            dropcapParagraphs.forEach((paragraph) => dropcapObserver.observe(paragraph));
        </script>
        
    </body>
</html>
